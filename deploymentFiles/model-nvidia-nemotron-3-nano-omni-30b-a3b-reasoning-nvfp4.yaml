apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-nvidia-nemotron-3-nano-omni-30b-a3b-reasoning-nvfp4
  namespace: llm
  labels:
    app.kubernetes.io/part-of: localllm-model
    app.kubernetes.io/name: llm-nvidia-nemotron-3-nano-omni-30b-a3b-reasoning-nvfp4
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llm-nvidia-nemotron-3-nano-omni-30b-a3b-reasoning-nvfp4
  template:
    metadata:
      labels:
        app: llm-nvidia-nemotron-3-nano-omni-30b-a3b-reasoning-nvfp4
        app.kubernetes.io/part-of: localllm-model
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        args:
          - "--model=nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-NVFP4"
          - "--served-model-name=Nemotron-3-Nano-Omni-30B-A3B-Reasoning-NVFP4"
          - "--host=0.0.0.0"
          - "--port=8000"
          # 1. FIXED: Ensure proper tool call parser for Claude Code compatibility
          - "--enable-auto-tool-choice"
          - "--tool-call-parser"
          - "qwen3_coder"
          # 2. OPTIMIZED: Push memory up to allow deep context and breathing room for tools
          - "--gpu-memory-utilization=0.80"
          - "--load-format=safetensors"
          - "--max-model-len=131072"
          - "--max-num-seqs=2"
          - "--max-num-batched-tokens=4096"
          - "--enable-prefix-caching"
          - "--enable-chunked-prefill"
          - "--kv-cache-dtype=fp8"
          - "--dtype=bfloat16"
        ports:
          - containerPort: 8000
        resources:
          limits:
            nvidia.com/gpu: 1
        env:
          - name: VLLM_API_KEY
            valueFrom:
              secretKeyRef:
                name: llm-api-key
                key: API_KEY
          - name: HUGGING_FACE_HUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: HF_TOKEN
          - name: HF_HOME
            value: "/data/hf"
          - name: HUGGINGFACE_HUB_CACHE
            value: "/data/hf/hub"
          - name: TRANSFORMERS_CACHE
            value: "/data/hf/transformers"
          - name: OMP_NUM_THREADS
            value: "8"
          - name: OMP_SCHEDULE
            value: "dynamic"
        volumeMounts:
          - name: hf-cache
            mountPath: /data/hf
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: llm-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: llm-active
  namespace: llm
  labels:
    app.kubernetes.io/part-of: localllm-model
spec:
  selector:
    app: llm-nvidia-nemotron-3-nano-omni-30b-a3b-reasoning-nvfp4
  ports:
    - port: 80
      targetPort: 8000

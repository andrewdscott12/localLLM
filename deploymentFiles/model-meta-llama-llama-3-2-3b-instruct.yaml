apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-meta-llama-llama-3-2-3b-instruct
  namespace: llm
  labels:
    app.kubernetes.io/part-of: localllm-model
    app.kubernetes.io/name: llm-meta-llama-llama-3-2-3b-instruct
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llm-meta-llama-llama-3-2-3b-instruct
  template:
    metadata:
      labels:
        app: llm-meta-llama-llama-3-2-3b-instruct
        app.kubernetes.io/part-of: localllm-model
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        args:
          - "--model=meta-llama/Llama-3.2-3B-Instruct"
          - "--served-model-name=Llama-3.2-3B-Instruct"
          - "--host=0.0.0.0"
          - "--port=8000"
          - "--gpu-memory-utilization=0.1"
          - "--max-model-len=8192"
          - "--max-num-seqs=2"
          - "--enable-prefix-caching"
          - "--enable-chunked-prefill"
          - "--enforce-eager"
          - "--dtype"
          - "bfloat16"
          - "--kv-cache-dtype=fp8"
        ports:
          - containerPort: 8000
        resources:
          limits:
            nvidia.com/gpu: 1
        env:
          - name: VLLM_API_KEY
            valueFrom:
              secretKeyRef:
                name: llm-api-key
                key: API_KEY
          - name: HUGGING_FACE_HUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: HF_TOKEN
          - name: HF_HOME
            value: "/data/hf"
          - name: HUGGINGFACE_HUB_CACHE
            value: "/data/hf/hub"
          - name: TRANSFORMERS_CACHE
            value: "/data/hf/transformers"
          - name: OMP_NUM_THREADS
            value: "8"
          - name: OMP_SCHEDULE
            value: "dynamic"
        volumeMounts:
          - name: hf-cache
            mountPath: /data/hf
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: llm-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: llm-active
  namespace: llm
  labels:
    app.kubernetes.io/part-of: localllm-model
spec:
  selector:
    app: llm-meta-llama-llama-3-2-3b-instruct
  ports:
    - port: 80
      targetPort: 8000

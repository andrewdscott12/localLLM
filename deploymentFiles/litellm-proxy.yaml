apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: llm
data:
  config.yaml: |
    model_list:
      - model_name: gemma-4-31B-it
        litellm_params:
          model: openai/gemma-4-31B-it
          api_base: http://llm-active.llm.svc.cluster.local/v1
          api_key: os.environ/UPSTREAM_OPENAI_API_KEY
      - model_name: gemma-4-e4b-it
        litellm_params:
          model: openai/gemma-4-e4b-it
          api_base: http://llm-active.llm.svc.cluster.local/v1
          api_key: os.environ/UPSTREAM_OPENAI_API_KEY
      - model_name: Qwen3-Coder-30B-A3B-Instruct
        litellm_params:
          model: openai/Qwen3-Coder-30B-A3B-Instruct
          api_base: http://llm-active.llm.svc.cluster.local/v1
          api_key: os.environ/UPSTREAM_OPENAI_API_KEY
      - model_name: Qwen2.5-14B-Instruct
        litellm_params:
          model: openai/Qwen2.5-14B-Instruct
          api_base: http://llm-active.llm.svc.cluster.local/v1
          api_key: os.environ/UPSTREAM_OPENAI_API_KEY
      - model_name: Qwen2.5-Coder-7B-Instruct
        litellm_params:
          model: openai/Qwen2.5-Coder-7B-Instruct
          api_base: http://llm-active.llm.svc.cluster.local/v1
          api_key: os.environ/UPSTREAM_OPENAI_API_KEY
      - model_name: deepseek-coder-33b-instruct
        litellm_params:
          model: openai/deepseek-coder-33b-instruct
          api_base: http://llm-active.llm.svc.cluster.local/v1
          api_key: os.environ/UPSTREAM_OPENAI_API_KEY
      - model_name: Nemotron-3-Nano-Omni-30B-A3B-Reasoning-NVFP4
        litellm_params:
          model: openai/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-NVFP4
          api_base: http://llm-active.llm.svc.cluster.local/v1
          api_key: os.environ/UPSTREAM_OPENAI_API_KEY
      - model_name: Llama-3.2-3B-Instruct
        litellm_params:
          model: openai/Llama-3.2-3B-Instruct
          api_base: http://llm-active.llm.svc.cluster.local/v1
          api_key: os.environ/UPSTREAM_OPENAI_API_KEY
      - model_name: default
        litellm_params:
          model: openai/default
          api_base: http://llm-active.llm.svc.cluster.local/v1
          api_key: os.environ/UPSTREAM_OPENAI_API_KEY
    litellm_settings:
      drop_params: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  namespace: llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm-proxy
  template:
    metadata:
      labels:
        app: litellm-proxy
    spec:
      containers:
      - name: litellm
        image: ghcr.io/berriai/litellm:main-latest
        args:
          - "--config=/app/config.yaml"
          - "--host=0.0.0.0"
          - "--port=4000"
        ports:
          - containerPort: 4000
        env:
          - name: LITELLM_MASTER_KEY
            valueFrom:
              secretKeyRef:
                name: llm-api-key
                key: API_KEY
          - name: UPSTREAM_OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: llm-api-key
                key: API_KEY
        volumeMounts:
          - name: litellm-config-volume
            mountPath: /app/config.yaml
            subPath: config.yaml
        readinessProbe:
          httpGet:
            path: /health/liveliness
            port: 4000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/liveliness
            port: 4000
          initialDelaySeconds: 15
          periodSeconds: 20
      volumes:
        - name: litellm-config-volume
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-proxy
  namespace: llm
spec:
  selector:
    app: litellm-proxy
  ports:
    - name: http
      port: 4000
      targetPort: 4000

